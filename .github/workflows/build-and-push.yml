name: Build & Publish Images

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

  workflow_dispatch:

  schedule:
    - cron: "0 3 3 * *"

jobs:
  build:
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]
        os: ["bookworm", "trixie"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate build timestamp
        id: date
        shell: bash
        run: |
          echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"

          if [ "$BRANCH_NAME" = "main" ]; then
            TAG_PREFIX=""
          else
            TAG_PREFIX="$(echo "$BRANCH_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g' \
              | sed -E 's/^-+|-+$//g')-"
          fi

          if [ "$((JOB_INDEX + 1))" -eq "$JOB_TOTAL" ]; then
            IS_LATEST="true"
          else
            IS_LATEST="false"
          fi

          echo "tag_prefix=${TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker tags
        id: tags
        shell: bash
        run: |
          IMAGE_DOCKERHUB="alchatti/drupal-devcontainer"
          IMAGE_GHCR="ghcr.io/alchatti/drupal-devcontainer"

          TAG_PREFIX="${{ steps.meta.outputs.tag_prefix }}"
          PHP_VERSION="${{ matrix.php }}"
          OS_VERSION="${{ matrix.os }}"
          TIMESTAMP="${{ steps.date.outputs.timestamp }}"

          {
            echo "tags<<EOF"

            # Always publish OS-specific tags
            echo "${IMAGE_DOCKERHUB}:${TAG_PREFIX}${PHP_VERSION}-${OS_VERSION}-${TIMESTAMP}"
            echo "${IMAGE_DOCKERHUB}:${TAG_PREFIX}${PHP_VERSION}-${OS_VERSION}"
            echo "${IMAGE_GHCR}:${TAG_PREFIX}${PHP_VERSION}-${OS_VERSION}-${TIMESTAMP}"
            echo "${IMAGE_GHCR}:${TAG_PREFIX}${PHP_VERSION}-${OS_VERSION}"

            # Final matrix combination gets PHP-only aliases
            if [ "${{ steps.meta.outputs.is_latest }}" = "true" ]; then
              echo "${IMAGE_DOCKERHUB}:${TAG_PREFIX}${PHP_VERSION}-${TIMESTAMP}"
              echo "${IMAGE_DOCKERHUB}:${TAG_PREFIX}${PHP_VERSION}"
              echo "${IMAGE_GHCR}:${TAG_PREFIX}${PHP_VERSION}-${TIMESTAMP}"
              echo "${IMAGE_GHCR}:${TAG_PREFIX}${PHP_VERSION}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PKG_GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VARIANT=${{ matrix.php }}
            NODE_VERSION=node
            OS=${{ matrix.os }}
            CREATE_DATE=${{ steps.date.outputs.date }}
            BUILD_TIMESTAMP=${{ steps.date.outputs.timestamp }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
