# This is a basic workflow to help you get started with Actions

name: Build & Publish Images

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # pull_request:
  #   branches: [ main ]
  #   paths-ignore: ['**.md']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 3 3 * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        php_ver: ["8.2", "8.3", "8.4"]
    uses: alchatti/.github/.github/workflows/docker-build-push.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args: |
        VARIANT=${{ matrix.php_ver }}
        NODE_VERSION=node
        CREATE_DATE=${{ needs.prepare.outputs.date }}
      tags: |
        alchatti/drupal-devcontainer:${{ matrix.php_ver }}-${{ needs.prepare.outputs.date }}
        alchatti/drupal-devcontainer:${{ matrix.php_ver }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
