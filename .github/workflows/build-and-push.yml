name: Build & Publish Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

  workflow_dispatch:

  schedule:
    - cron: "0 3 3 * *"

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Prepare build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="alchatti/drupal-devcontainer"
          CONTEXT="."
          TARGET=""

          PHP_VERSIONS='["8.1", "8.2", "8.3"]'
          OS_VERSIONS='["bookworm", "trixie"]'

          DATE="$(date -u +'%Y%m%d')"
          TIMESTAMP="$(date -u +'%Y%m%d%H%M%S')"

          BRANCH_NAME="${GITHUB_REF_NAME}"

          if [ "$BRANCH_NAME" = "main" ]; then
            TAG_PREFIX=""
          else
            TAG_PREFIX="$(echo "$BRANCH_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g' \
              | sed -E 's/^-+|-+$//g')-"
          fi

          MATRIX="$(jq -cn \
            --arg image "$IMAGE" \
            --arg context "$CONTEXT" \
            --arg target "$TARGET" \
            --arg date "$DATE" \
            --arg timestamp "$TIMESTAMP" \
            --arg tag_prefix "$TAG_PREFIX" \
            --argjson php_versions "$PHP_VERSIONS" \
            --argjson os_versions "$OS_VERSIONS" '
              [
                $php_versions[] as $php |
                $os_versions[] as $os |
                {
                  php: $php,
                  os: $os
                }
              ] as $items
              |
              [
                range(0; $items | length) as $i |
                $items[$i] as $item |
                ($i == (($items | length) - 1)) as $is_latest |
                {
                  php: $item.php,
                  os: $item.os,
                  context: $context,
                  target: $target,
                  variant: ($item.php + "-" + $item.os),
                  build_args: (
                    "VARIANT=" + $item.php + "\n" +
                    "NODE_VERSION=node\n" +
                    "OS=" + $item.os + "\n" +
                    "CREATE_DATE=" + $date + "\n" +
                    "BUILD_TIMESTAMP=" + $timestamp
                  ),
                  tags: (
                    $image + ":" + $tag_prefix + $item.php + "-" + $item.os + "-" + $timestamp + "\n" +
                    $image + ":" + $tag_prefix + $item.php + "-" + $item.os +
                    (
                      if $is_latest then
                        "\n" + $image + ":" + $tag_prefix + $item.php + "-" + $timestamp +
                        "\n" + $image + ":" + $tag_prefix + $item.php
                      else
                        ""
                      end
                    )
                  ),
                  test_image_tag: ("local/drupal-devcontainer:" + $item.php + "-" + $item.os + "-ci")
                }
              ]
            ')"

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          {
            echo "## Prepared Build Matrix"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${BRANCH_NAME}\` |"
            echo "| Tag prefix | \`${TAG_PREFIX}\` |"
            echo "| Date | \`${DATE}\` |"
            echo "| Timestamp | \`${TIMESTAMP}\` |"
            echo ""
            echo "### Matrix"
            echo ""
            echo '```json'
            echo "$MATRIX" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare

    permissions:
      contents: read

    strategy:
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    uses: alchatti/.github/.github/workflows/docker-build-push.yml@main

    with:
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.context }}/Dockerfile

      build_args: ${{ matrix.build_args }}
      tags: ${{ matrix.tags }}
      target: ${{ matrix.target }}

      test_command: |
         echo "required"
         exit 1
      test_platform: linux/amd64
      test_image_tag: ${{ matrix.test_image_tag }}

      cache_from: type=gha,scope=${{ matrix.variant }}
      cache_to: type=gha,mode=max,scope=${{ matrix.variant }}

    secrets: inherit
